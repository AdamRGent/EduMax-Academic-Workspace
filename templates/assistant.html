<!DOCTYPE html>
<html>
<head>
    <title>EduMax Socratic Study Coach</title>
    <style>
        .chat-container { max-width: 650px; margin: 40px auto; border: 1px solid #ddd; border-radius: 12px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 550px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chat-header { background: #17a2b8; color: white; padding: 15px 20px; border-top-left-radius: 11px; border-top-right-radius: 11px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-header a { color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 4px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 18px; max-width: 80%; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background: #17a2b8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #f1f3f5; color: #212529; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e9ecef; }
        .chat-input-area { display: flex; padding: 15px; border-top: 1px solid #eee; background: white; border-bottom-left-radius: 11px; border-bottom-right-radius: 11px; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; outline: none; font-size: 15px; }
        .chat-input-area button { background: #17a2b8; color: white; border: none; padding: 0 24px; margin-left: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        .chat-input-area button:hover { background: #138496; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>🎓 EduMax AI Study Coach</span>
        <a href="{{ url_for('home_page') }}">Exit Panel</a>
    </div>
    <div class="chat-box" id="chat-box">
        <div class="message ai-msg">Welcome back! Type any concept, homework question, or module topic you want to unpack. I'm here to coach you through it step-by-step.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Ask a question about your studies..." autocomplete="off">
        <button id="send-btn">Ask Coach</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, isUser) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', isUser ? 'user-msg' : 'ai-msg');
        // Clean up line breaks coming from the LLM engine formatting strings
        msgDiv.innerHTML = text.replace(/\n/g, '<br>');
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        userInput.value = '';

        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('message', 'ai-msg');
        loadingDiv.innerText = "Consulting web sources & framing response...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        fetch('/api/ai/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text })
        })
        .then(res => res.json())
        .then(data => {
            chatBox.removeChild(loadingDiv);
            appendMessage(data.answer, false);
        })
        .catch(() => {
            chatBox.removeChild(loadingDiv);
            appendMessage("Connection Error: Unable to access the AI core database array.", false);
        });
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>

</body>
</html>
