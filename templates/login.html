<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduMax - Authenticate Portal</title>
    <meta name="author" content="TM252 Module Team">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; background-color: #f8f9fa; }
        body { margin: 0; background-color: #f8f9fa; color: #212529; padding: 2rem 0; }
        .container { width: 100%; padding-right: 15px; padding-left: 15px; margin-right: auto; margin-left: auto; max-width: 1140px; box-sizing: border-box; }
        .row { display: flex; flex-wrap: wrap; margin-right: -15px; margin-left: -15px; }
        .col-md-4 { flex: 0 0 auto; width: 33.333333%; padding: 0 15px; box-sizing: border-box; }
        .col-md-6 { flex: 0 0 auto; width: 50%; padding: 0 15px; box-sizing: border-box; }
        .col-md-8 { flex: 0 0 auto; width: 66.666667%; padding: 0 15px; box-sizing: border-box; }
        .col-12 { flex: 0 0 auto; width: 100%; padding: 0 15px; box-sizing: border-box; }
        .justify-content-center { justify-content: center; }
        .align-items-center { align-items: center; }
        .d-flex { display: flex; }
        
        .bg-dark { background-color: #212529 !important; color: #fff; padding: 10px; border-radius: 0.375rem; }
        .bg-white { background-color: #fff !important; }
        .text-center { text-align: center; }
        .text-end { text-align: right; }
        .fw-bold { font-weight: 700; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .p-4 { padding: 1.5rem; }
        .border-top { border-top: 1px solid #dee2e6 !important; }
        .rounded { border-radius: 0.375rem; }
        .shadow-sm { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .img-fluid { max-width: 100%; height: auto; }
        
        .navbar-nav { display: flex; list-style: none; margin: 0; padding: 0; gap: 1rem; align-items: center; flex-direction: row; }
        .nav-link { color: rgba(255,255,255,0.55); text-decoration: none; padding: 0.5rem 0; font-weight: 500; }
        .badge { display: inline-block; padding: 0.35em 0.65em; font-size: 0.75em; font-weight: 700; border-radius: 0.375rem; }
        .bg-secondary { background-color: #6c757d !important; color: #fff; }
        .breadcrumb { display: flex; padding: 0; margin-bottom: 1.5rem; list-style: none; gap: 0.5rem; }
        .breadcrumb a { text-decoration: none; color: #0d6efd; }
        .form-label { display: inline-block; margin-bottom: 0.5rem; font-weight: 600; color: #495057; }
        .form-control { display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; line-height: 1.5; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; box-sizing: border-box; }
        .text-white-50 { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        .text-danger { color: #dc3545; font-size: 0.9rem; font-weight: bold; margin-bottom: 1rem; }
        .visually-hidden-focusable { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        
        .btn { display: block; width: 100%; font-weight: 600; text-align: center; cursor: pointer; border: 1px solid transparent; padding: 0.5rem 1.25rem; font-size: 1rem; border-radius: 0.375rem; text-decoration: none; }
        .btn-primary { color: #fff; background-color: #0d6efd; border-color: #0d6efd; }
    </style>
</head>
<body>
    <a href="#main-content" class="visually-hidden-focusable">Skip to main content</a>

    <div class="container">
        <header class="header mb-4">
            <div class="row align-items-center mb-3" style="margin-top: 1rem;">
                <div class="col-md-4">
                    <!-- The correct, secure way to route images in a Flask framework application -->
                    <!-- Explicitly scaling your logo asset so it pops cleanly next to your text title -->
                    <img src="{{ url_for('static', filename='images/EduMax_logo.png') }}" 
                        alt="EduMax logo" 
                        style="height: 75px; width: auto; object-fit: contain; margin-right: 15px;">
                </div>
                <div class="col-md-4 text-center">
                    <h1 class="fw-bold" style="font-size: 2.8rem; margin: 0; color:#212529;">EduMax</h1>
                </div>
            </div>
            
            <div class="row bg-dark rounded shadow-sm">
                <div class="col-md-8">
                    <nav class="navbar">
                        <ul class="navbar-nav flex-row">
                            <li><a class="nav-link" href="{{ url_for('home_page') }}">Home</a></li>
                            <li style="color: rgba(255,255,255,0.3); padding: 0 0.25rem;">|</li>
                            <li><a class="nav-link" href="{{ url_for('news_page') }}">News</a></li>
                            <li style="color: rgba(255,255,255,0.3); padding: 0 0.25rem;">|</li>
                            <li><a class="nav-link" href="{{ url_for('modules_page') }}">Modules</a></li>
                            <li style="color: rgba(255,255,255,0.3); padding: 0 0.25rem;">|</li>
                            <li><a class="nav-link" href="{{ url_for('membership_page') }}">Membership</a></li>
                            <li><a class="nav-link"  href="{{ url_for('assistant_page') }}"> AI Study Coach</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="col-md-4 text-end align-items-center d-flex justify-content-end">
                    <span class="text-white-50"><small>Secure Gateway</small></span>
                </div>
            </div>
        </header>

        <main id="main-content" class="py-4">
            <div class="row justify-content-center">
                <!-- Centered Login Box Column -->
                <div class="col-md-6">
                    <div class="bg-white p-4 shadow-sm rounded border">
                        <h2 class="fw-bold mb-4 text-center" style="font-size: 1.6rem; color: #212529; margin-top:0;">Account Authentication</h2>
                        
                        <!-- Dynamic error banner check sent from Python -->
                        {% if error %}
                            <div class="text-danger text-center">{{ error }}</div>
                        {% endif %}

                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email Address</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="name@edumax.ac.uk" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary fw-bold">Authenticate Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center mt-5 py-4 border-top" style="color: #6c757d;">
            <small>&copy; 2026 EduMax Virtual Academic Workspace. System Mockup Protocol.</small>
        </footer>
    </div>
</body>
</html>
