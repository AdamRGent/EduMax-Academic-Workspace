<h2>System Security Audit Log</h2>
<!-- Navigation & Utility Options Area -->
<div style="margin-bottom: 20px;">
    <a href="{{ url_for('home_page') }}">Back to Home</a>
    <span style="margin: 0 10px;">|</span>
    
    <!-- Direct Export File Action Trigger Link Component -->
    <a href="{{ url_for('download_logs') }}" style="background-color: #28a745; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold;">
        📥 Export Logs to CSV
    </a>
</div>
<table border="1" cellpadding="10" style="margin-top:20px; width:100%; text-align:left;">
    <thead>
        <tr>
            <th>Timestamp</th>
            <th>Administrator</th>
            <th>Action Performed</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log[2] }}</td>
            <td><strong>{{ log[0] }}</strong></td>
            <td>{{ log[1] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
